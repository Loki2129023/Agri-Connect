    <div class="background">
        <div class="content">
            <h1><u>Crop-Price-Prediction</u></h1>
            <form id="prediction-form" class="form-container">
                <label for="state"><b>STATE:</b></label>
                <input type="text" name="state" id="state" required><br><br>

                <label for="district"><b>DISTRICT:</b></label>
                <input type="text" name="district" id="district" required><br><br>

                <label for="crop_name"><b>CROP-NAME:</b></label>
                <input type="text" name="crop_name" id="crop_name" required><br><br>

                <button type="submit">PREDICT PRICE</button>
            </form>

            <br>
            <div id="result" class="result"></div>

            <!-- Adding Logout and Back buttons -->
          
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Farmer Website</p>
    </footer>

    <script>
        const form = document.getElementById('prediction-form');
        const resultDiv = document.getElementById('result');

        form.onsubmit = async function (e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            resultDiv.innerHTML = "Loading..."; // Show loading text while fetching data
            
            try {
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.predicted_price) {
                        resultDiv.innerHTML = `Predicted Price: ₹${data.predicted_price}`;
                    } else {
                        resultDiv.innerHTML = `Error: Invalid prediction response from server.`;
                    }
                } else {
                    const errorData = await response.json();
                    resultDiv.innerHTML = `Error: ${errorData.error || 'Unable to fetch the prediction.'}`;
                }
            } catch (error) {
                console.error("Fetch error:", error);
                resultDiv.innerHTML = "Error: Unable to connect to the server.";
            }
        };
    </script>
